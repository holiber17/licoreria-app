[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# El service worker nunca se cachea: así las versiones nuevas llegan al instante
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Los archivos de /assets llevan un hash en el nombre: se pueden guardar para siempre
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
