name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pruebas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pruebas/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Correr pruebas
        run: npx playwright test
      - name: Guardar reporte si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: pruebas/playwright-report/
          retention-days: 7
