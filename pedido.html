<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mi pedido — LicorApp</title>
<meta name="theme-color" content="#110e0c">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/componentes.css">
<link rel="stylesheet" href="css/pedido.css">
</head>
<body class="cliente-body" data-titulo="Mi pedido — ">
<div class="shell">
  <header class="hdr">
    <div class="marca">
      <img id="negocio-logo" src="icon.svg" alt="">
      <h1 id="negocio-nombre">Tu pedido</h1>
    </div>
    <div class="live-badge" id="live-badge">
      <span class="live-dot"></span>
      En vivo
    </div>
  </header>

  <main class="content" id="content">
    <div class="loading">
      <div class="spinner"></div>
      <span>Cargando tu pedido...</span>
    </div>
  </main>

  <footer class="footer">
    Se actualiza al instante · <strong>LicorApp</strong>
  </footer>
</div>

<div id="hoja-pago" class="modal">
  <div class="hoja">
    <div class="hoja-cab">
      <span class="hoja-titulo">Pagar la cuenta</span>
      <button class="icon-btn" onclick="cerrarPago()" aria-label="Cerrar"><i class="ti ti-x"></i></button>
    </div>
    <div id="pago-cuerpo"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js"></script>
<script src="js/publico.js"></script>
<script src="js/pedido-cliente.js"></script>
</body>
</html>
